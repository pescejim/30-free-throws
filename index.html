<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>#30 Free Throws</title>
<style>
  :root{
    --navy:#12275a;
    --navy-deep:#0a1738;
    --navy-mid:#1b3775;
    --gold:#f2b01e;
    --gold-soft:#ffd34d;
    --green:#2ecc71;
    --green-dark:#1e9e54;
    --ink:#ffffff;
    --ink-dim:#c9d4f2;
    --panel:#0e1e46;
    --red:#ff5d5d;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Arial Rounded MT Bold","Arial Black",Arial,sans-serif;
    background:var(--navy-deep);
    color:var(--ink);
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  #app{
    display:flex; flex-direction:column;
    height:100dvh;
    height:100vh;
    max-width:520px;
    margin:0 auto;
    background:linear-gradient(180deg,#0d1d42 0%, var(--navy) 55%, #0d1d42 100%);
    position:relative;
  }

  /* ---------- Level chips ---------- */
  .levels{
    display:flex; gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none;
    flex:0 0 auto;
    align-items:center;
  }
  .levels::-webkit-scrollbar{ display:none; }
  .brand{
    font-weight:900; font-size:15px; letter-spacing:.5px;
    color:var(--gold); white-space:nowrap;
    text-shadow:0 2px 0 rgba(0,0,0,.35);
    padding-right:2px;
  }
  .chip{
    flex:0 0 auto;
    border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.08);
    color:var(--ink-dim);
    border-radius:999px;
    padding:8px 14px;
    font:inherit; font-size:13px; font-weight:800;
    cursor:pointer;
    min-height:38px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .chip .dot{ font-size:11px; }
  .chip.active{
    background:var(--gold); color:var(--navy-deep);
    border-color:var(--gold-soft);
    box-shadow:0 3px 0 #b57f08;
  }
  .chip.locked{ opacity:.45; cursor:default; }
  .chip .check{ color:var(--green); font-weight:900; }
  .chip.active .check{ color:var(--green-dark); }

  /* ---------- HUD ---------- */
  .hud{
    display:grid;
    grid-template-columns:1fr auto auto auto auto;
    gap:8px;
    padding:2px 12px 6px;
    align-items:center;
    flex:0 0 auto;
  }
  .sound-btn{
    flex:0 0 auto;
    width:48px; height:48px; min-width:48px; min-height:48px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; line-height:1;
    background:rgba(0,0,0,.28);
    border:2px solid rgba(255,255,255,.22);
    border-radius:12px;
    color:var(--ink);
    cursor:pointer;
    padding:0;
    font-family:inherit;
  }
  .sound-btn:active{ background:rgba(255,255,255,.22); }
  .sound-btn.muted{ opacity:.75; }
  .hud-left{ min-width:0; }
  .level-name{
    font-size:17px; font-weight:900; line-height:1.1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .hud-sub{ font-size:12px; color:var(--ink-dim); font-weight:700; margin-top:2px; }
  .hud-sub b{ color:var(--gold); }
  .stat{
    background:rgba(0,0,0,.28);
    border:2px solid rgba(255,255,255,.14);
    border-radius:12px;
    padding:5px 10px;
    text-align:center;
    min-width:64px;
  }
  .stat .lab{ font-size:9px; letter-spacing:1.2px; color:var(--ink-dim); font-weight:800; }
  .stat .val{ font-size:19px; font-weight:900; line-height:1.15; }
  .stat .val.gold{ color:var(--gold); }
  .streak-fire{ color:var(--gold); }
  .top-line{
    flex:0 0 auto; padding:0 12px 5px;
    font-size:12px; font-weight:800; color:var(--ink-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .top-line[hidden]{ display:none; }
  .top-line b{ color:var(--gold); }

  /* ---------- Court ---------- */
  .court-wrap{ flex:1 1 auto; position:relative; min-height:0; }
  svg.court{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .twist-badge{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:var(--navy-deep);
    font-size:12px; font-weight:900; letter-spacing:.4px;
    padding:6px 12px; border-radius:999px;
    box-shadow:0 3px 0 rgba(0,0,0,.35);
    white-space:nowrap; z-index:5;
  }
  .twist-badge[hidden]{ display:none; }
  .feedback{
    position:absolute; top:29%; left:50%;
    transform:translate(-50%,-50%) scale(.6);
    font-size:clamp(28px,8vw,44px);
    font-weight:900; letter-spacing:1px;
    color:var(--gold);
    text-shadow:0 3px 0 rgba(0,0,0,.5), 0 0 22px rgba(242,176,30,.35);
    opacity:0; pointer-events:none; z-index:6;
    text-align:center; white-space:nowrap;
  }
  .feedback.show{ animation:pop 1.15s ease-out forwards; }
  .feedback.miss{ color:#e8ecf7; }
  .feedback.hot{ font-size:clamp(20px,6.2vw,32px); white-space:normal; width:92%; line-height:1.15; }
  /* Referee gag: middle layer — in front of the court, behind the
     end-of-round panel (z 20) and feedback text (z 6). Never interactive. */
  .ref-layer{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    pointer-events:none; z-index:4;
    opacity:0; transition:opacity .6s ease;
  }
  .ref-layer.show{ opacity:1; }
  @keyframes pop{
    0%{ opacity:0; transform:translate(-50%,-40%) scale(.55); }
    14%{ opacity:1; transform:translate(-50%,-50%) scale(1.12); }
    26%{ transform:translate(-50%,-50%) scale(1); }
    78%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-62%) scale(1); }
  }

  /* ---------- Meter + controls ---------- */
  .controls{
    flex:0 0 auto;
    padding:8px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.25) 100%);
  }
  .meter-label{
    display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:4px 8px;
    font-size:11px; font-weight:800; letter-spacing:1.2px; color:var(--ink-dim);
    margin-bottom:5px;
  }
  .meter-label .zone-hint{ color:var(--green); letter-spacing:.4px; }
  .hot-badge{
    background:#d93a22; color:#fff;
    font-size:10px; font-weight:900; letter-spacing:.8px;
    padding:3px 8px; border-radius:999px;
    box-shadow:0 2px 0 rgba(0,0,0,.35);
    white-space:nowrap;
  }
  .hot-badge[hidden]{ display:none; }
  .meter{
    position:relative;
    height:34px;
    background:linear-gradient(180deg,#24304f,#141d33);
    border:3px solid rgba(255,255,255,.22);
    border-radius:10px;
    overflow:hidden;
  }
  .meter .zone{
    position:absolute; top:0; bottom:0;
    background:linear-gradient(180deg,#4be584,var(--green-dark));
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
    transition:left .38s ease, width .38s ease;
  }
  .meter .zone.pulsing{ animation:zonePulse .55s ease; }
  @keyframes zonePulse{
    0%{ filter:brightness(1); }
    35%{ filter:brightness(1.65); box-shadow:inset 0 0 0 2px #fff, 0 0 18px rgba(46,204,113,.95); }
    100%{ filter:brightness(1); }
  }
  .meter .zone::after{
    content:"SWISH ZONE";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:900; letter-spacing:1px; color:rgba(255,255,255,.92);
    text-shadow:0 1px 2px rgba(0,0,0,.4);
    overflow:hidden; white-space:nowrap;
  }
  .meter .needle{
    position:absolute; top:-2px; bottom:-2px; width:8px; margin-left:-4px;
    background:var(--gold);
    border-radius:4px;
    box-shadow:0 0 0 2px #fff, 0 0 14px rgba(242,176,30,.8);
  }
  .meter.frozen .needle{ background:#fff; }
  .btn-row{ display:flex; gap:10px; margin-top:12px; align-items:stretch; }
  .shoot-btn{
    flex:1 1 auto;
    font:inherit; font-size:24px; font-weight:900; letter-spacing:2px;
    color:var(--navy-deep);
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    border:none; border-radius:16px;
    padding:16px 10px;
    min-height:64px;
    cursor:pointer;
    box-shadow:0 6px 0 #b57f08, 0 10px 18px rgba(0,0,0,.4);
    transition:transform .06s, box-shadow .06s;
  }
  .shoot-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b57f08, 0 6px 10px rgba(0,0,0,.4); }
  .shoot-btn:disabled{ opacity:.55; cursor:default; }
  .share-mini{
    flex:0 0 auto;
    font:inherit; font-size:13px; font-weight:800;
    color:var(--ink);
    background:rgba(255,255,255,.1);
    border:2px solid rgba(255,255,255,.25);
    border-radius:16px;
    padding:10px 14px;
    min-height:64px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .share-mini .ico{ font-size:18px; line-height:1; }
  .share-mini:active{ background:rgba(255,255,255,.22); }

  /* ---------- End-of-round panel ---------- */
  .overlay{
    position:absolute; inset:0; z-index:20;
    background:rgba(5,10,28,.55);
    display:none;
    align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .overlay.shown{ display:flex; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .panel{
    width:100%;
    background:linear-gradient(180deg,var(--navy-mid),var(--panel));
    border-top:4px solid var(--gold);
    border-radius:22px 22px 0 0;
    padding:22px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(105%);
    transition:transform .38s cubic-bezier(.2,.9,.25,1.05);
    text-align:center;
    box-shadow:0 -12px 30px rgba(0,0,0,.5);
  }
  .overlay.open .panel{ transform:translateY(0); }
  .panel h2{ margin:0 0 2px; font-size:26px; font-weight:900; letter-spacing:.5px; }
  .panel .panel-sub{ color:var(--ink-dim); font-size:13px; font-weight:700; margin-bottom:12px; }
  .stars{ font-size:38px; letter-spacing:6px; line-height:1; margin:4px 0 10px; }
  .stars .on{ color:var(--gold); text-shadow:0 2px 0 rgba(0,0,0,.4); }
  .stars .off{ color:rgba(255,255,255,.18); }
  .panel-stats{
    display:flex; gap:10px; justify-content:center; margin-bottom:16px;
  }
  .panel-stats .stat{ flex:1 1 0; max-width:130px; padding:8px 6px; }
  .panel-stats .val{ font-size:24px; }
  .new-best{
    display:inline-block; background:var(--green); color:#fff; font-weight:900; font-size:12px;
    padding:4px 10px; border-radius:999px; margin-bottom:10px; letter-spacing:.5px;
  }
  .panel-btns{ display:flex; flex-direction:column; gap:10px; }
  .pbtn{
    font:inherit; font-size:17px; font-weight:900; letter-spacing:.5px;
    border-radius:14px; padding:14px 12px; min-height:56px; cursor:pointer; border:none;
  }
  .pbtn.primary{ background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:var(--navy-deep); box-shadow:0 5px 0 #b57f08; }
  .pbtn.primary:active{ transform:translateY(3px); box-shadow:0 2px 0 #b57f08; }
  .pbtn.ghost{ background:rgba(255,255,255,.1); color:var(--ink); border:2px solid rgba(255,255,255,.3); }
  .pbtn.ghost:active{ background:rgba(255,255,255,.22); }

  /* ---------- Leaderboard ---------- */
  .panel{ position:relative; max-height:94dvh; overflow-y:auto; }
  .lb-overlay{ z-index:25; }
  .lb-close{
    position:absolute; top:12px; right:12px;
    width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:900; line-height:1;
    background:rgba(0,0,0,.28); color:var(--ink);
    border:2px solid rgba(255,255,255,.25); border-radius:12px;
    cursor:pointer; font-family:inherit; padding:0;
  }
  .lb-close:active{ background:rgba(255,255,255,.22); }
  .lb-list{ display:flex; flex-direction:column; gap:8px; margin:4px 0 14px; text-align:left; }
  .lb-row{
    display:flex; align-items:center; gap:10px;
    background:rgba(0,0,0,.28);
    border:2px solid rgba(255,255,255,.12);
    border-radius:12px; padding:9px 12px;
  }
  .lb-row.first{ border-color:var(--gold); background:rgba(242,176,30,.16); }
  .lb-rank{ font-size:17px; font-weight:900; min-width:26px; text-align:center; color:var(--ink-dim); }
  .lb-row.first .lb-rank{ color:var(--gold); }
  .lb-main{ flex:1 1 auto; min-width:0; }
  .lb-name{ font-size:15px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-meta{ font-size:11px; font-weight:700; color:var(--ink-dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-score{ font-size:20px; font-weight:900; color:var(--gold); text-align:right; line-height:1; }
  .lb-score .lb-pts{ display:block; font-size:9px; letter-spacing:1px; color:var(--ink-dim); font-weight:800; margin-top:2px; }
  .lb-empty{ color:var(--ink-dim); font-weight:700; font-size:14px; padding:12px 6px 16px; text-align:center; }
  .lb-status{
    font-size:12px; font-weight:700; color:var(--ink-dim);
    background:rgba(0,0,0,.25); border:2px solid rgba(255,255,255,.14);
    border-radius:999px; padding:5px 12px; margin:0 0 12px;
    display:inline-block;
  }
  .lb-status[hidden]{ display:none; }
  .lb-entry{
    background:rgba(242,176,30,.14);
    border:2px solid var(--gold);
    border-radius:14px; padding:12px; margin-bottom:14px;
  }
  .lb-entry[hidden]{ display:none; }
  .lb-note{ font-size:14px; font-weight:900; color:var(--gold-soft); margin-bottom:10px; }
  .lb-form{ display:flex; gap:8px; }
  .lb-input{
    flex:1 1 auto; min-width:0;
    font:inherit; font-size:15px; font-weight:700;
    color:var(--ink); background:rgba(0,0,0,.35);
    border:2px solid rgba(255,255,255,.3); border-radius:10px;
    padding:10px 12px; min-height:48px;
    user-select:text; -webkit-user-select:text;
  }
  .lb-input::placeholder{ color:rgba(201,212,242,.6); }
  .lb-save{
    flex:0 0 auto; font:inherit; font-size:15px; font-weight:900;
    color:var(--navy-deep);
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    border:none; border-radius:10px; padding:10px 16px; min-height:48px;
    cursor:pointer; box-shadow:0 4px 0 #b57f08;
  }
  .lb-save:active{ transform:translateY(2px); box-shadow:0 2px 0 #b57f08; }
  .lb-skip{
    margin-top:6px; background:none; border:none;
    font:inherit; font-size:12px; font-weight:800; color:var(--ink-dim);
    cursor:pointer; text-decoration:underline; padding:4px;
  }
  .lb-saved{ font-size:14px; font-weight:900; color:var(--green); }
  .lb-saved[hidden]{ display:none; }

  /* ---------- Toast ---------- */
  .toast{
    position:absolute; left:50%; bottom:120px; transform:translateX(-50%) translateY(16px);
    background:#fff; color:var(--navy-deep);
    font-size:14px; font-weight:900;
    padding:10px 18px; border-radius:999px;
    box-shadow:0 8px 20px rgba(0,0,0,.45);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:30;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (min-width:560px){
    #app{ border-left:2px solid rgba(255,255,255,.08); border-right:2px solid rgba(255,255,255,.08); }
  }
  @media (prefers-reduced-motion: reduce){
    .feedback.show{ animation-duration:.4s; }
    .panel, .overlay{ transition-duration:.01s; }
    .meter .zone{ transition-duration:.01s; }
    .meter .zone.pulsing{ animation:none; }
    .ref-layer{ transition-duration:.01s; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- Level chips (horizontally scrollable; one chip per level in LEVELS) -->
  <div class="levels" id="levelChips" role="tablist" aria-label="Levels"></div>

  <!-- Reigning top scorer (only shown when the leaderboard has a #1) -->
  <div class="top-line" id="topLine" hidden></div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <div class="level-name" id="hudLevelName">Level 1 · Warm-Up</div>
      <div class="hud-sub">Best <b id="hudBest">0</b> · Streak <b id="hudStreak">0</b><span id="hudStreakFire" class="streak-fire"></span></div>
    </div>
    <div class="stat">
      <div class="lab">SCORE</div>
      <div class="val gold" id="hudScore">0</div>
    </div>
    <div class="stat">
      <div class="lab">SHOTS LEFT</div>
      <div class="val" id="hudShots">10</div>
    </div>
    <button class="sound-btn" id="trophyBtn" type="button" aria-label="Leaderboard — tap to view top scores">🏆</button>
    <button class="sound-btn" id="soundBtn" type="button" aria-label="Sound on — tap to mute" aria-pressed="false">🔊</button>
  </div>

  <!-- Court -->
  <div class="court-wrap" id="courtWrap">
    <svg class="court" id="courtSvg" viewBox="0 0 400 460" preserveAspectRatio="xMidYMid meet" aria-label="Basketball court">
      <!-- Wall / stands -->
      <rect x="0" y="0" width="400" height="330" fill="#16295c"/>
      <rect x="0" y="0" width="400" height="118" fill="#0e1e46"/>
      <!-- Crowd silhouettes -->
      <g fill="#223a75">
        <circle cx="18" cy="96" r="10"/><circle cx="46" cy="90" r="11"/><circle cx="76" cy="97" r="10"/>
        <circle cx="106" cy="90" r="11"/><circle cx="136" cy="96" r="10"/><circle cx="166" cy="90" r="11"/>
        <circle cx="196" cy="97" r="10"/><circle cx="226" cy="90" r="11"/><circle cx="256" cy="96" r="10"/>
        <circle cx="286" cy="90" r="11"/><circle cx="316" cy="97" r="10"/><circle cx="346" cy="90" r="11"/>
        <circle cx="376" cy="96" r="10"/>
        <rect x="0" y="100" width="400" height="10" rx="4"/>
      </g>
      <g fill="#2a4484">
        <circle cx="32" cy="66" r="9"/><circle cx="62" cy="60" r="10"/><circle cx="94" cy="67" r="9"/>
        <circle cx="124" cy="60" r="10"/><circle cx="156" cy="66" r="9"/><circle cx="186" cy="60" r="10"/>
        <circle cx="218" cy="67" r="9"/><circle cx="248" cy="60" r="10"/><circle cx="280" cy="66" r="9"/>
        <circle cx="310" cy="60" r="10"/><circle cx="342" cy="67" r="9"/><circle cx="368" cy="60" r="10"/>
        <rect x="0" y="72" width="400" height="8" rx="4"/>
      </g>
      <!-- Banner -->
      <g>
        <rect x="102" y="14" width="196" height="34" rx="6" fill="#f2b01e"/>
        <text x="200" y="37" text-anchor="middle" font-size="15" font-weight="900" fill="#12275a" font-family="Arial Rounded MT Bold, Arial, sans-serif" letter-spacing="1">#30 FREE THROWS</text>
      </g>
      <!-- Wall padding line -->
      <rect x="0" y="118" width="400" height="6" fill="#f2b01e" opacity=".55"/>
      <!-- Court floor -->
      <rect x="0" y="330" width="400" height="130" fill="#c98a3d"/>
      <rect x="0" y="330" width="400" height="130" fill="#d99b47" opacity=".45"/>
      <g stroke="#8a5a1e" stroke-width="2" opacity=".5">
        <line x1="0" y1="356" x2="400" y2="356"/><line x1="0" y1="386" x2="400" y2="386"/>
        <line x1="0" y1="416" x2="400" y2="416"/><line x1="0" y1="446" x2="400" y2="446"/>
      </g>
      <!-- Painted key + free-throw line -->
      <rect x="288" y="330" width="112" height="78" fill="#12275a" opacity=".85"/>
      <circle cx="288" cy="369" r="34" fill="none" stroke="#ffffff" stroke-width="3" opacity=".8"/>
      <line x1="126" y1="330" x2="126" y2="408" stroke="#ffffff" stroke-width="3" opacity=".8"/>
      <ellipse cx="200" cy="452" rx="180" ry="8" fill="#000000" opacity=".08"/>

      <!-- Hoop assembly (slides sideways on moving-hoop levels) -->
      <g id="hoopGroup">
        <!-- support arm -->
        <rect x="392" y="196" width="10" height="14" fill="#5b6472"/>
        <!-- backboard -->
        <rect x="322" y="182" width="72" height="52" rx="4" fill="#f4f6fb" stroke="#12275a" stroke-width="3"/>
        <rect x="344" y="206" width="28" height="20" fill="none" stroke="#e2543e" stroke-width="3"/>
        <!-- rim -->
        <ellipse id="rim" cx="336" cy="238" rx="17" ry="4.5" fill="none" stroke="#e2543e" stroke-width="4"/>
        <!-- net (ripples on a make) -->
        <g id="net" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round">
          <path class="net-strand" d="M322 242 L328 268 L334 276"/>
          <path class="net-strand" d="M331 243 L334 268 L336 276"/>
          <path class="net-strand" d="M341 243 L340 268 L338 276"/>
          <path class="net-strand" d="M350 242 L344 268 L340 276"/>

<script>
(function(){
"use strict";

/* =====================================================================
   LEVELS — every level of the game is defined here, one object per level.
   To add a new level, just append another object to this array; the game
   (chips row, unlocking, HUD, best scores) handles any number of levels.

   Fields:
     name             Level name shown in the HUD and chips.
     twist            Short label for the level's twist, shown as a badge
                      on the court. Use "" for no twist (Level 1).
     zoneWidth        Width of the green swish zone on the power meter,
                      as a fraction of the meter (0.05 = very hard,
                      0.30 = very easy).
     meterSpeed       How fast the needle sweeps, in meter-widths per
                      second (0.5 = gentle, 1.6 = frantic).
     movingHoop       0 = hoop stays still. Otherwise the hoop slides
                      sideways by this many SVG units (try 10–26).
     wind             -1..1 sideways drift applied to the ball in flight
                      (negative pushes left/short, positive right/long).
     defender         true = a waving defender hand appears by the hoop
                      and narrows the effective swish zone.
     pointsMultiplier Multiplies all points scored on this level.
   ===================================================================== */
var LEVELS = [
  {
    name: "Warm-Up",
    twist: "",
    zoneWidth: 0.30,
    meterSpeed: 0.55,
    movingHoop: 0,
    wind: 0,
    defender: false,
    pointsMultiplier: 1
  }
  /* Future levels get appended here, e.g.:
  ,{
    name: "Moving Hoop",
    twist: "Moving Hoop",
    zoneWidth: 0.24,
    meterSpeed: 0.7,
    movingHoop: 16,
    wind: 0,
    defender: false,
    pointsMultiplier: 1
  }
  */
];

var SHOTS_PER_ROUND = 10;
var SAVE_KEY = "ft30-save-v1";

/* ---------- Persistent state (progress, unlocks, best scores) ---------- */
var save = loadSave();
function loadSave(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      if(s && typeof s === "object") return { best: s.best||{}, done: s.done||{}, current: s.current||0, muted: !!s.muted, leaderboard: Array.isArray(s.leaderboard) ? s.leaderboard.slice(0,5) : [], lastName: typeof s.lastName === "string" ? s.lastName : "" };
    }
  }catch(e){}
  return { best:{}, done:{}, current:0, muted:false, leaderboard:[], lastName:"" };
}
function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
}
function isUnlocked(i){
  if(i === 0) return true;
  return !!save.done[i-1];
}

/* ---------- Leaderboard: SHARED Top 5 (Google Apps Script) + local fallback ----------
   The shared board lives at SHARED_URL (Jim's Apps Script web app backed by a
   Google Sheet). GET returns {scores:[{name,score,makes,shots,level,date},...]}
   sorted best-first. POST appends a score. The localStorage board below stays
   as an offline fallback and a backup copy of every saved score.
   ALL network code here is defensive: any failure/timeout is swallowed and
   can never break gameplay, block a panel, or surface an error. */
var LB_MAX = 5;
var SHARED_URL = "https://script.google.com/macros/s/AKfycbw2PYTyICFnFT3xJAsVNUhO4gUjWi_lnu-CBmptN5H1A6X3BfD3_83M886eGocu86Y/exec";
var SHARED_TIMEOUT_MS = 6000;
var sharedBoard = null;       /* last successfully fetched shared board (array) or null if never loaded */
var sharedLoaded = false;     /* true once any shared fetch has succeeded */
var sharedOffline = false;    /* true when the latest fetch failed and no shared board is available */
var lbPending = null;    /* {score, makes, shots, level, date} from the round just finished */
var lbHandled = false;   /* true once this round's entry is saved or skipped */

function lbBoard(){
  if(!Array.isArray(save.leaderboard)) save.leaderboard = [];
  return save.leaderboard;
}
function lbQualifies(sc){
  /* Qualify against the shared board when it has loaded; otherwise local. */
  if(sharedLoaded && sharedBoard){
    if(sharedBoard.length < LB_MAX) return true;
    return sc > sharedBoard[LB_MAX-1].score;
  }
  var b = lbBoard();
  if(b.length < LB_MAX) return true;
  return sc > b[b.length-1].score;
}
function lbIsTopScore(sc){
  if(sharedLoaded && sharedBoard){
    return sharedBoard.length === 0 || sc > sharedBoard[0].score;
  }
  var b = lbBoard();
  return b.length === 0 || sc > b[0].score;
}
function formatLbDate(raw){
  /* Sheets may return a full date string ("Sat Nov 14 2026 00:00:00 GMT-0500
     (Eastern Standard Time)"): if it parses as a date, show it short
     ("Nov 14"); otherwise show the value as-is. */
  if(raw === null || raw === undefined || raw === "") return "";
  try{
    var d = new Date(raw);
    if(!isNaN(d.getTime())) return d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
  }catch(e){}
  return String(raw);
}
function normalizeSharedEntry(e){
  if(!e || typeof e !== "object") return null;
  var sc = Number(e.score);
  if(isNaN(sc)) return null;
  var mk = Number(e.makes); if(isNaN(mk)) mk = 0;
  var sh = Number(e.shots); if(isNaN(sh)) sh = 0;
  return {
    name: (e.name === null || e.name === undefined || String(e.name).trim() === "") ? "Player" : String(e.name),
    score: sc,
    makes: mk,
    shots: sh,
    level: (e.level === null || e.level === undefined) ? "" : String(e.level),
    date: (e.date === null || e.date === undefined) ? "" : String(e.date)
  };
}
function fetchSharedBoard(){
  /* Fetch + cache the shared board, then refresh the Top line and (if it is
     showing) the leaderboard panel. Never throws. */
  try{
    if(typeof fetch !== "function"){ onSharedFetchFail(); return; }
    var controller = null, timeoutId = null;
    var opts = { method:"GET" };
    try{
      if(typeof AbortController !== "undefined"){
        controller = new AbortController();
        opts.signal = controller.signal;
        timeoutId = setTimeout(function(){ try{ controller.abort(); }catch(e){} }, SHARED_TIMEOUT_MS);
      }
    }catch(e){ controller = null; }
    var clearT = function(){ if(timeoutId !== null){ try{ clearTimeout(timeoutId); }catch(e){} timeoutId = null; } };
    fetch(SHARED_URL, opts).then(function(res){
      clearT();
      if(!res || !res.ok) throw new Error("bad response");
      return res.json();
    }).then(function(data){
      try{
        if(!data || !Array.isArray(data.scores)) throw new Error("bad payload");
        var cleaned = [];
        data.scores.forEach(function(e){ var n = normalizeSharedEntry(e); if(n) cleaned.push(n); });
        cleaned.sort(function(a, c){
          if(c.score !== a.score) return c.score - a.score;
          if(c.makes !== a.makes) return c.makes - a.makes;
          return 0;
        });
        sharedBoard = cleaned;
        sharedLoaded = true;
        sharedOffline = false;
        try{ updateTopLine(); }catch(e){}
        try{ renderLeaderboard(); }catch(e){}
      }catch(e){ onSharedFetchFail(); }
    }, function(){ clearT(); onSharedFetchFail(); });
  }catch(e){ onSharedFetchFail(); }
}
function onSharedFetchFail(){
  try{
    if(!sharedLoaded) sharedOffline = true;
    try{ updateTopLine(); }catch(e){}
    try{ renderLeaderboard(); }catch(e){}
  }catch(e){}
}
function submitSharedScore(entry){
  /* Fire-and-forget POST (text/plain + no-cors avoids a CORS preflight and
     the opaque response is fine — we refetch the board to confirm). Then
     refetch after ~1.5s, since the sheet takes a moment to update. */
  try{
    if(typeof fetch === "function"){
      var payload = { name: entry.name, score: entry.score, makes: entry.makes, shots: entry.shots, level: entry.level };
      try{
        var p = fetch(SHARED_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload),
          mode: "no-cors"
        });
        if(p && typeof p.then === "function") p.then(function(){}, function(){});
      }catch(e){}
    }
  }catch(e){}
  try{ setTimeout(function(){ fetchSharedBoard(); }, 1500); }catch(e){}
}
function updateTopLine(){
  /* Shared #1 whenever the shared board has loaded; local #1 as fallback. */
  var b;
  if(sharedLoaded && sharedBoard) b = sharedBoard;
  else b = lbBoard();
  topLineEl.textContent = "";
  if(b.length && b[0]){
    var nameB = document.createElement("b"); nameB.textContent = b[0].name;
    var scoreB = document.createElement("b"); scoreB.textContent = b[0].score + " pts";
    topLineEl.appendChild(document.createTextNode("🏆 Top: "));
    topLineEl.appendChild(nameB);
    topLineEl.appendChild(document.createTextNode(" — "));
    topLineEl.appendChild(scoreB);
    topLineEl.hidden = false;
  } else {
    topLineEl.hidden = true;
  }
}
function renderLeaderboard(){
  /* Shared Top 5 when loaded; otherwise the local board (with an offline
     note once a fetch has failed). Renders from cache instantly — the
     fetch triggered on open refreshes it in place. */
  var useShared = !!(sharedLoaded && sharedBoard);
  var b = useShared ? sharedBoard.slice(0, LB_MAX) : lbBoard();
  if(lbStatusEl){
    if(!useShared && sharedOffline){
      lbStatusEl.textContent = "Offline — showing this device's scores";
      lbStatusEl.hidden = false;
    } else {
      lbStatusEl.textContent = "";
      lbStatusEl.hidden = true;
    }
  }
  lbListEl.innerHTML = "";
  if(!b.length){
    var empty = document.createElement("div");
    empty.className = "lb-empty";
    empty.textContent = "No scores yet — be the first.";
    lbListEl.appendChild(empty);
    return;
  }
  b.forEach(function(entry, i){
    var row = document.createElement("div");
    row.className = "lb-row" + (i === 0 ? " first" : "");
    var rank = document.createElement("div");
    rank.className = "lb-rank";
    rank.textContent = i === 0 ? "👑" : String(i+1);
    var main = document.createElement("div"); main.className = "lb-main";
    var nm = document.createElement("div"); nm.className = "lb-name"; nm.textContent = entry.name;
    var meta = document.createElement("div"); meta.className = "lb-meta";
    meta.textContent = entry.makes + "/" + entry.shots + " · " + entry.level + " · " + formatLbDate(entry.date);
    main.appendChild(nm); main.appendChild(meta);
    var sc = document.createElement("div"); sc.className = "lb-score";
    sc.appendChild(document.createTextNode(String(entry.score)));
    var pts = document.createElement("span"); pts.className = "lb-pts"; pts.textContent = "PTS";
    sc.appendChild(pts);
    row.appendChild(rank); row.appendChild(main); row.appendChild(sc);
    lbListEl.appendChild(row);
  });
}
function openLeaderboard(){
  renderLeaderboard();
  try{ fetchSharedBoard(); }catch(e){}
  lbOverlay.classList.add("shown");
  void lbOverlay.offsetWidth;
  setTimeout(function(){ lbOverlay.classList.add("open"); }, 30);
}
function closeLeaderboard(){
  lbOverlay.classList.remove("open");
  setTimeout(function(){ lbOverlay.classList.remove("shown"); }, 260);
}
function setupLbEntry(){
  lbPending = null; lbHandled = false;
  lbEntryEl.hidden = true; lbSavedMsgEl.hidden = true;
  if(!lbQualifies(score)) return;
  lbPending = { score: score, makes: makes, shots: SHOTS_PER_ROUND, level: level.name, date: new Date().toISOString() };
  lbNoteEl.textContent = lbIsTopScore(score) ? "🏆 You're the new top scorer!" : "🏆 You made the leaderboard!";
  lbNameInput.value = save.lastName || "";
  lbFormEl.style.display = "";
  lbSkipBtn.style.display = "";
  lbEntryEl.hidden = false;
}
function saveLbEntry(){
  if(!lbPending || lbHandled) return;
  var name = (lbNameInput.value || "").trim();
  if(!name) name = "Player";
  if(name.length > 16) name = name.slice(0, 16);
  var entry = { name: name, score: lbPending.score, makes: lbPending.makes, shots: lbPending.shots, level: lbPending.level, date: lbPending.date };
  var b = lbBoard();
  b.push(entry);
  b.sort(function(a, c){
    if(c.score !== a.score) return c.score - a.score;
    if(c.makes !== a.makes) return c.makes - a.makes;
    return new Date(a.date) - new Date(c.date);
  });
  save.leaderboard = b.slice(0, LB_MAX);
  save.lastName = name;
  lbHandled = true; lbPending = null;
  persist();
  /* Also send it to the shared board (fire-and-forget; the local save above
     already stands either way, and the shared board refetches in ~1.5s). */
  try{ submitSharedScore({ name: entry.name, score: entry.score, makes: entry.makes, shots: entry.shots, level: entry.level }); }catch(e){}
  updateTopLine();
  renderLeaderboard();
  var rank = save.leaderboard.indexOf(entry);
  lbFormEl.style.display = "none";
  lbSkipBtn.style.display = "none";
  lbSavedMsgEl.textContent = rank >= 0 ? "✓ Saved — you're #" + (rank+1) + " on the board!" : "✓ Saved!";
  lbSavedMsgEl.hidden = false;
}

/* ---------- DOM ---------- */
function $(id){ return document.getElementById(id); }
var chipsEl = $("levelChips"), hudLevelName = $("hudLevelName"),
    hudBest = $("hudBest"), hudStreak = $("hudStreak"), hudStreakFire = $("hudStreakFire"),
    hudScore = $("hudScore"), hudShots = $("hudShots"),
    twistBadge = $("twistBadge"), feedbackEl = $("feedback"),
    meterEl = $("meter"), zoneEl = $("meterZone"), needleEl = $("needle"), hotBadge = $("hotBadge"),
    shootBtn = $("shootBtn"), courtWrap = $("courtWrap"),
    hoopGroup = $("hoopGroup"), netEl = $("net"), defenderEl = $("defender"),
    defHand = $("defHand"), ballEl = $("ball"), ballShadow = $("ballShadow"),
    overlay = $("overlay"), toastEl = $("toast"), soundBtn = $("soundBtn"),

var missClipBuf = null, missClipSrc = null, missClipDecoding = false;
var refClipBuf = null, refClipSrc = null, refClipDecoding = false;

function ensureAudio(){
  try{
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
      /* Master chain: gain -> compressor (anti-clipping) -> destination */
      var comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 22;
      comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.24;
      comp.connect(audioCtx.destination);
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 0.55;
      masterGain.connect(comp);
      /* Shared 1s white-noise buffer for whoosh / swish / crowd */
      var len = audioCtx.sampleRate;
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      var data = noiseBuf.getChannelData(0);
      for(var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    }
    if(audioCtx.state === "suspended") audioCtx.resume();
    decodeMissClip();   /* decode eagerly so the first miss plays instantly */
    decodeRefClip();    /* same for the referee's line */
  }catch(e){ return null; }
  return audioCtx;
}
function audioReady(){
  if(muted) return null;
  return ensureAudio();
}
/* One filtered-noise burst; freq sweeps f0 -> f1 over dur seconds. */
function noiseBurst(o){
  var ctx = audioReady(); if(!ctx || !noiseBuf) return;
  try{
    var t = ctx.currentTime + (o.delay || 0);
    var src = ctx.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    src.playbackRate.value = o.rate || 1;
    var flt = ctx.createBiquadFilter();
    flt.type = o.type || "bandpass";
    flt.Q.value = o.q != null ? o.q : 1;
    flt.frequency.setValueAtTime(o.f0, t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(o.f1, 1), t + o.dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol, t + (o.attack || 0.02));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    src.connect(flt); flt.connect(g); g.connect(masterGain);
    src.start(t); src.stop(t + o.dur + 0.05);
    if(o.onended) src.onended = o.onended;
  }catch(e){}
}
/* One oscillator tone with pitch glide and a soft envelope. */
function tone(o){
  var ctx = audioReady(); if(!ctx) return;
  try{
    var t = ctx.currentTime + (o.delay || 0);
    var osc = ctx.createOscillator();
    osc.type = o.wave || "sine";
    osc.frequency.setValueAtTime(o.f0, t);
    if(o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(o.f1, 1), t + o.dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol, t + (o.attack || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + o.dur + 0.05);
  }catch(e){}
}

  tone({ wave:"triangle", f0:820, f1:520, dur:0.06, vol:0.07 });

function sfxBounce(){          // low dribble thump (if a bounce is ever animated)
  tone({ wave:"sine", f0:150, f1:62, dur:0.13, vol:0.16 });
  noiseBurst({ type:"lowpass", f0:420, f1:180, dur:0.06, vol:0.05, q:0.7 });

  noiseBurst({ type:"bandpass", f0:380, f1:1750, dur:0.3, vol:0.15, q:0.9, attack:0.07 });

function sfxSwish(big){        // crisp net swish (filtered noise sweep)
  noiseBurst({ type:"bandpass", f0:3400, f1:750, dur: big ? 0.26 : 0.18, vol: big ? 0.20 : 0.11, q:0.8, attack:0.015 });
  if(big) noiseBurst({ type:"highpass", f0:4200, f1:2400, dur:0.14, vol:0.07, q:0.7 });

function sfxRim(){             // metallic rim clang: inharmonic partials
  var partials = [1244, 1868, 2513, 3410];

    tone({ wave:"sine", f0:partials[i], dur:0.34 - i * 0.05, vol:0.075 / (i + 1) });
  }
  noiseBurst({ type:"highpass", f0:3000, f1:3000, dur:0.03, vol:0.05, q:0.7 });
}
function sfxBoard(){           // backboard thud
  tone({ wave:"sine", f0:118, f1:54, dur:0.17, vol:0.22 });
  noiseBurst({ type:"lowpass", f0:520, f1:160, dur:0.09, vol:0.10, q:0.7 });
}
function sfxMissThud(){        // soft dull thud as the ball drops away
  tone({ wave:"sine", f0:92, f1:44, dur:0.26, vol:0.17, delay:0.05 });
  noiseBurst({ type:"lowpass", f0:300, f1:120, dur:0.14, vol:0.06, q:0.7, delay:0.05 });
}
function sfxCheer(big){        // crowd cheer swell (capped overlaps)
  if(crowdActive >= 2) return;
  var ctx = audioReady(); if(!ctx) return;
  crowdActive++;
  var dur = big ? 1.15 : 0.75;
  var done = function(){ crowdActive = Math.max(0, crowdActive - 1); };
  noiseBurst({ type:"bandpass", f0:760, f1:1050, dur:dur, vol: big ? 0.17 : 0.11, q:0.55, attack: big ? 0.14 : 0.09, onended:done });
  noiseBurst({ type:"bandpass", f0:1350, f1:1650, dur:dur * 0.85, vol: big ? 0.10 : 0.06, q:0.7, attack:0.11, rate:0.83 });
  if(big){ /* a couple of bright whistles on the big cheer */
    tone({ wave:"sine", f0:2350, f1:2650, dur:0.16, vol:0.028, delay:0.12 });
    tone({ wave:"sine", f0:2500, f1:2250, dur:0.14, vol:0.024, delay:0.34 });
  }
}
function sfxAww(){             // low disappointed murmur when a hot streak breaks
  if(crowdActive >= 2) return;
  var ctx = audioReady(); if(!ctx) return;
  crowdActive++;
  noiseBurst({ type:"lowpass", f0:640, f1:300, dur:0.85, vol:0.10, q:0.6, attack:0.1,
               onended:function(){ crowdActive = Math.max(0, crowdActive - 1); } });
  tone({ wave:"triangle", f0:392, f1:233, dur:0.8, vol:0.045, attack:0.08 });
  tone({ wave:"triangle", f0:415, f1:247, dur:0.8, vol:0.038, attack:0.08, delay:0.05 });
}
/* --- Miss clip: Jim's MP3, decoded into the same WebAudio graph so the
   master gain (and therefore the mute toggle) controls it too. --- */
function decodeMissClip(){
  if(missClipBuf || missClipDecoding || !audioCtx) return;
  missClipDecoding = true;
  try{
    var bin = atob(MISS_MP3_B64);
    var bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    audioCtx.decodeAudioData(bytes.buffer,
      function(buf){ missClipBuf = buf; missClipDecoding = false; },
      function(){ missClipDecoding = false; });
  }catch(e){ missClipDecoding = false; }
}
function stopMissClip(){
  if(missClipSrc){
    try{ missClipSrc.onended = null; missClipSrc.stop(); }catch(e){}
    missClipSrc = null;
  }
}
function playMissClip(){       // restart Jim's clip from the top on a miss
  if(muted) return;
  var ctx = ensureAudio(); if(!ctx) return;
  stopMissClip();
  if(!missClipBuf){ decodeMissClip(); return; }
  try{
    var src = ctx.createBufferSource();
    src.buffer = missClipBuf;
    src.connect(masterGain);
    src.onended = function(){ if(missClipSrc === src) missClipSrc = null; };
    missClipSrc = src;
    src.start(0);
  }catch(e){}
}

/* --- Referee clip: the spoken line "That's lazy officiating!", played
   once when the referee starts crossing. Same treatment as the miss
   clip: embedded base64, decoded into the WebAudio graph so the master
   gain (and therefore the mute toggle) controls it too. --- */
function decodeRefClip(){
  if(refClipBuf || refClipDecoding || !audioCtx) return;
  refClipDecoding = true;
  try{
    var bin = atob(REF_MP3_B64);
    var bytes = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    audioCtx.decodeAudioData(bytes.buffer,
      function(buf){ refClipBuf = buf; refClipDecoding = false; },
      function(){ refClipDecoding = false; });
  }catch(e){ refClipDecoding = false; }
}
function stopRefClip(){
  if(refClipSrc){
    try{ refClipSrc.onended = null; refClipSrc.stop(); }catch(e){}
    refClipSrc = null;
  }
}
function playRefClip(){          // once per referee appearance
  if(muted) return;
  var ctx = ensureAudio(); if(!ctx) return;
  if(ctx.state !== "running") return;   /* no gesture yet: he strolls in silence rather than the line firing late */
  if(!refClipBuf){ decodeRefClip(); return; }
  stopRefClip();
  try{
    var src = ctx.createBufferSource();
    src.buffer = refClipBuf;
    src.connect(masterGain);
    src.onended = function(){ if(refClipSrc === src) refClipSrc = null; };
    refClipSrc = src;
    src.start(0);
  }catch(e){}
}

function sfxChime(){           // happy three-note chime for 2–3 star rounds
  var notes = [659.25, 783.99, 1046.5];   // E5 · G5 · C6
  for(var i = 0; i < notes.length; i++){
    tone({ wave:"triangle", f0:notes[i], dur:0.34, vol:0.11, delay:i * 0.13 });
    tone({ wave:"sine", f0:notes[i] * 2, dur:0.2, vol:0.03, delay:i * 0.13 });
  }
}

/* --- Mute toggle --- */
function updateSoundBtn(){
  if(!soundBtn) return;
  soundBtn.textContent = muted ? "🔇" : "🔊";
  soundBtn.classList.toggle("muted", muted);
  soundBtn.setAttribute("aria-pressed", muted ? "true" : "false");
  soundBtn.setAttribute("aria-label", muted ? "Sound off — tap to unmute" : "Sound on — tap to mute");
}
function setMuted(m){
  muted = m;
  if(m){ stopMissClip(); stopRefClip(); }
  save.muted = m; persist();
  if(masterGain && audioCtx){
    try{ masterGain.gain.setTargetAtTime(m ? 0 : 0.55, audioCtx.currentTime, 0.02); }catch(e){}
  }
  updateSoundBtn();
}

/* ---------- Level chips ---------- */
function renderChips(){
  chipsEl.innerHTML = "";
  var brand = document.createElement("span");
  brand.className = "brand";
  brand.textContent = "#30 FREE THROWS";
  chipsEl.appendChild(brand);
  LEVELS.forEach(function(lv, i){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (i === levelIndex ? " active" : "") + (isUnlocked(i) ? "" : " locked");
    var label = "Level " + (i+1);
    if(save.done[i]) label += ' <span class="check">✓</span>';
    if(!isUnlocked(i)) label += ' <span class="dot">🔒</span>';
    b.innerHTML = label;
    b.setAttribute("aria-label", "Level " + (i+1) + ": " + lv.name + (isUnlocked(i) ? "" : " (locked)"));
    if(isUnlocked(i)){
      b.addEventListener("click", function(){ ensureAudio(); sfxClick(); selectLevel(i); });
    }
    chipsEl.appendChild(b);
  });
  var active = chipsEl.querySelector(".chip.active");
  if(active && active.scrollIntoView) active.scrollIntoView({ block:"nearest", inline:"nearest" });
}

function selectLevel(i){
  levelIndex = i;
  level = LEVELS[i];
  save.current = i; persist();
  startRound();
  renderChips();
}

/* ---------- Round flow ---------- */
function startRound(){
  stopMissClip();
  score = 0; makes = 0; shotsLeft = SHOTS_PER_ROUND; streak = 0;
  hotActive = false; hotFirstTaken = 0; hotFirstMakes = 0; hotFailed = false; hotPendingTrigger = false;
  if(hotBadge) hotBadge.hidden = true;
  zoneEl.classList.remove("pulsing");
  roundOver = false;
  meterPos = 0.08; meterDir = 1; meterRunning = true;
  ballState = "held"; flight = null;
  idleTime = 0; idleFired = false;   /* fresh idle stretch for the new round */
  resetBall();
  overlay.classList.remove("open");
  setTimeout(function(){ if(!roundOver) overlay.classList.remove("shown"); }, 420);
  lbPending = null; lbHandled = false;
  lbEntryEl.hidden = true;
  lbOverlay.classList.remove("open"); lbOverlay.classList.remove("shown");
  shootBtn.disabled = false;
  defenderEl.style.display = level.defender ? "" : "none";
  if(level.twist){
    twistBadge.textContent = "Twist: " + level.twist;
    twistBadge.hidden = false;
  } else {
    twistBadge.hidden = true;
  }
  layoutZone();
  updateHUD();
  scheduleReferee();   /* maybe he'll stroll through this round… */
  /* Shooter arms the first shot of the round (only once audio is unlocked) */
  if(audioCtx) sfxSet();
}

function layoutZone(){
  var w = effectiveZoneWidth();
  var c = zoneCenter();
  zoneEl.style.left = ((c - w/2) * 100) + "%";
  zoneEl.style.width = (w * 100) + "%";
}

function resetBall(){
  ball.x = 118; ball.y = 196; ball.r = 0;
  ballEl.setAttribute("transform", "translate(" + ball.x + "," + ball.y + ") rotate(0)");
  ballShadow.setAttribute("cx", 96);
  ballShadow.setAttribute("opacity", ".22");
}

function updateHUD(){
  hudLevelName.textContent = "Level " + (levelIndex+1) + " · " + level.name;
  hudBest.textContent = save.best[levelIndex] || 0;
  hudScore.textContent = score;
  hudShots.textContent = shotsLeft;
  hudStreak.textContent = streak;
  hudStreakFire.textContent = streak >= 3 ? " 🔥" : "";
}

/* ---------- Shooting ---------- */
function shoot(){
  if(ballState !== "held" || roundOver) return;
  ensureAudio();
  stopMissClip();   /* a new shot (make or miss) never talks over the clip */
  idleTime = 0; idleFired = false;   /* a released shot resets + re-arms the idle trigger */
  pendingPrevStreak = streak;
  meterRunning = false;
  meterEl.classList.add("frozen");
  shotsLeft--;

  var c = zoneCenter();
  var half = effectiveZoneWidth()/2;
  var dist = Math.abs(meterPos - c);
  var outcome, pts = 0, msg;

  var isSwish = dist <= half * 0.28;
  var isInZone = dist <= half;
  var isNear = dist <= half + 0.09;

  if(isSwish){
    outcome = "swish"; pts = 3;
  } else if(isInZone){
    outcome = "make"; pts = 2;
  } else if(isNear && Math.random() < 0.45){
    outcome = "rattle"; pts = 2;
  } else if(isNear){
    outcome = "rim";
  } else {
    outcome = "miss";
  }

  if(pts > 0){
    streak++;
    var gained = pts + (streak >= 3 ? 1 : 0);
    gained *= level.pointsMultiplier;
    score += gained;
    makes++;
    if(outcome === "swish") msg = "SWISH! +" + gained;
    else if(outcome === "rattle") msg = "Off the rim… in! +" + gained;
    else msg = "Bucket! +" + gained;
  } else {
    streak = 0;
    msg = outcome === "rim" ? "Off the rim!" : "Miss!";
  }
  /* Hot start tracking: judge only the first 3 shots of the round */
  if(!hotActive && hotFirstTaken < 3){
    hotFirstTaken++;
    if(pts > 0){
      hotFirstMakes++;
      if(hotFirstTaken === 3 && hotFirstMakes === 3 && !hotFailed) hotPendingTrigger = true;
    } else {
      hotFailed = true;
    }
  }
  updateHUD();
  sfxWhoosh();
  flyBall(outcome, msg);
}

function flyBall(outcome, msg){
  ballState = "flying";
  var rimX = HOOP.rimX + hoopOffset;
  var rimY = HOOP.rimY;
  var targetX, targetY, kind;
  if(outcome === "swish" || outcome === "make"){ targetX = rimX; targetY = rimY + 26; kind = "in"; }
  else if(outcome === "rattle"){ targetX = rimX + 3; targetY = rimY + 24; kind = "rattle"; }
  else if(outcome === "rim"){ targetX = rimX - 13; targetY = rimY + 6; kind = "rim"; }
  else { targetX = rimX - 58; targetY = rimY + 40; kind = "miss"; }
  /* Wind nudges the flight path sideways */
  targetX += level.wind * 22;
  flight = {
    t: 0, dur: 0.78,
    x0: ball.x, y0: ball.y,
    x1: targetX, y1: targetY,
    peak: Math.min(ball.y, rimY) - 118,
    kind: kind, msg: msg, outcome: outcome,
    prevStreak: pendingPrevStreak,
    hotTrigger: hotPendingTrigger,
    scored: false
  };
}

function finishFlight(){
  var f = flight; flight = null;
  if(f.kind === "in" || f.kind === "rattle") rippleNet();
  /* Impact + crowd sounds, synced to the ball arriving at the hoop */
  var bigCheer = f.outcome === "swish" || streak >= 3;
  if(f.outcome === "swish"){
    sfxSwish(true);
    sfxCheer(bigCheer);
  } else if(f.outcome === "make"){
    sfxSwish(false);
    sfxCheer(bigCheer);
  } else if(f.outcome === "rattle"){
    sfxRim();
    setTimeout(function(){ sfxSwish(false); sfxCheer(bigCheer); }, 140);
  } else if(f.outcome === "rim"){
    sfxRim();
    playMissClip();
  } else { /* miss: clips the board, then drops away */
    sfxBoard();
    playMissClip();
  }
  if(f.hotTrigger && !hotActive){
    hotActive = true;
    hotPendingTrigger = false;
    layoutZone();
    if(hotBadge) hotBadge.hidden = false;
    zoneEl.classList.remove("pulsing");
    void zoneEl.offsetWidth;
    zoneEl.classList.add("pulsing");
    setTimeout(function(){ zoneEl.classList.remove("pulsing"); }, 600);
    showHotFeedback();
  } else {
    showFeedback(f.msg, f.outcome === "rim" || f.outcome === "miss");
  }
  ballState = "done";
  setTimeout(function(){
    meterEl.classList.remove("frozen");
    if(shotsLeft <= 0){
      endRound();
    } else {
      ballState = "held";
      resetBall();
      meterRunning = true;
      if(audioCtx) sfxSet();
    }
  }, 620);
}

function rippleNet(){
  var strands = netEl.querySelectorAll(".net-strand, .net-cross");
  var start = performance.now();
  function step(now){
    var t = (now - start) / 420;
    if(t >= 1){
      netEl.setAttribute("transform", "");
      return;
    }
    var sway = Math.sin(t * Math.PI * 3) * (1 - t) * 7;
    var stretch = Math.sin(Math.min(t * Math.PI, Math.PI)) * 5;
    netEl.setAttribute("transform", "translate(" + sway.toFixed(1) + "," + stretch.toFixed(1) + ")");
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function showFeedback(msg, isMiss){
  feedbackEl.textContent = msg;
  feedbackEl.className = "feedback" + (isMiss ? " miss" : "");
  /* restart the pop animation */
  void feedbackEl.offsetWidth;
  feedbackEl.classList.add("show");
}
function showHotFeedback(){
  feedbackEl.textContent = "🔥 3-for-3! Zone tightened";
  feedbackEl.className = "feedback hot";
  void feedbackEl.offsetWidth;
  feedbackEl.classList.add("show");
}

/* ---------- Referee gag ----------
   The ref strolls across the court on the middle layer, either at a
   random moment once per round or when the player stands idle for
   5 seconds with the ball ready. Pure decoration: pointer-events are
   off and he never touches gameplay, scoring, or the controls. The
   two triggers are coordinated so he never double-books: whichever
   fires first wins, a crossing already in progress blocks the other,
   an idle firing cancels that round's pending random appearance, and
   a random firing consumes the current idle stretch. The idle trigger
   is independent of the random schedule, so it can still bring him
   out in a round where the random appearance was skipped. */
function clearRefTimer(){
  if(refTimer){ clearTimeout(refTimer); refTimer = null; }
}
function hideReferee(){
  refWalk = null;
  if(refLayer) refLayer.classList.remove("show");
  if(refEl) refEl.style.display = "none";
}
function scheduleReferee(){
  clearRefTimer();
  hideReferee();
  /* About 1 round in 4 he never shows at all, so it stays a surprise.
     (The idle trigger below is separate and can still bring him out.) */
  if(Math.random() < 0.25) return;
  var delay = 4000 + Math.random() * 20000;   /* 4–24s after round start */
  refTimer = setTimeout(function(){
    refTimer = null;
    if(roundOver) return;                     /* only while a round is live */
    startRefereeCrossing("random");
  }, delay);
}
function startRefereeCrossing(source){
  /* Coordination first, so a blocked attempt still settles the other
     trigger for this round / idle stretch. */
  if(source === "idle"){
    clearRefTimer();          /* idle fired first: skip the pending random appearance */
  } else if(source === "random"){
    idleFired = true;         /* random fired first: this idle stretch is spent */
    idleTime = 0;
  }
  if(roundOver) return;                       /* never on the end-of-round panel */
  if(refWalk) return;                         /* already crossing: no second crossing */
  var dir = Math.random() < 0.5 ? 1 : -1;     /* random walking direction */
  refWalk = { x: dir > 0 ? -50 : 450, dir: dir, phase: 0 };
  if(refEl) refEl.style.display = "";
  if(refLayer) refLayer.classList.add("show");
  playRefClip();                              /* "That's lazy officiating!" */
}
function updateIdleReferee(dt){
  /* Count only while a round is live and the ball is ready to shoot:
     not during flight, not on the end-of-round panel, not between
     rounds (roundOver covers both), and not with no shots left. */
  if(roundOver || ballState !== "held" || shotsLeft <= 0) return;
  if(idleFired) return;                       /* at most once per idle stretch */
  idleTime += dt;
  if(idleTime >= IDLE_REF_SECONDS){
    idleFired = true;                         /* spent until the next shot re-arms it */
    idleTime = 0;
    startRefereeCrossing("idle");
  }
}
function fadeReferee(){                       /* round ended mid-crossing */
  clearRefTimer();
  refWalk = null;
  if(refLayer) refLayer.classList.remove("show");
  setTimeout(function(){ if(!refWalk && refEl) refEl.style.display = "none"; }, 650);
}
function updateReferee(dt){
  if(!refWalk) return;
  var speed = 500 / 7.6;                      /* full crossing in ~7.6 seconds */
  refWalk.x += refWalk.dir * speed * dt;
  refWalk.phase += dt * 7.5;                  /* casual stroll cadence */
  var swing = Math.sin(refWalk.phase) * 17;
  var bob = Math.abs(Math.sin(refWalk.phase)) * 2.2;
  refLegBack.setAttribute("transform", "rotate(" + swing.toFixed(1) + ",-4,-54)");
  refLegFront.setAttribute("transform", "rotate(" + (-swing).toFixed(1) + ",5,-54)");
  refEl.setAttribute("transform",
    "translate(" + refWalk.x.toFixed(1) + "," + (402 - bob).toFixed(1) + ") scale(" + refWalk.dir + ",1)");
  if((refWalk.dir > 0 && refWalk.x > 452) || (refWalk.dir < 0 && refWalk.x < -52)){
    hideReferee();                            /* crossed: gone until next round */
  }
}

/* ---------- End of round ---------- */
function endRound(){
  roundOver = true;
  idleTime = 0; idleFired = true;   /* idle trigger stops with the round */
  fadeReferee();       /* no referee on the idle / level-select state */
  meterRunning = false;
  shootBtn.disabled = true;
  var prevBest = save.best[levelIndex] || 0;
  var isNewBest = score > prevBest;
  if(isNewBest) save.best[levelIndex] = score;
  save.done[levelIndex] = true;
  persist();
  renderChips();
  updateHUD();

  var stars = makes >= 9 ? 3 : makes >= 7 ? 2 : makes >= 4 ? 1 : 0;
  sfxBuzzer();
  if(stars >= 2) setTimeout(sfxChime, 800);
  var starHtml = "";
  for(var i = 0; i < 3; i++) starHtml += '<span class="' + (i < stars ? "on" : "off") + '">★</span>';
  $("panelStars").innerHTML = starHtml;
  $("panelTitle").textContent = stars === 3 ? "Superstar Round! 🌟" : stars === 2 ? "Great Shooting!" : stars === 1 ? "Round Complete!" : "Keep Practicing!";
  $("panelSub").textContent = "Level " + (levelIndex+1) + " · " + level.name;
  $("panelMakes").textContent = makes + "/10";
  $("panelScore").textContent = score;
  $("panelBest").textContent = save.best[levelIndex] || 0;
  $("newBestTag").hidden = !isNewBest;
  setupLbEntry();
  var hasNext = levelIndex + 1 < LEVELS.length;
  $("nextLevelBtn").style.display = hasNext ? "" : "none";
  if(hasNext) $("nextLevelBtn").textContent = "Next Level ▶  Level " + (levelIndex+2) + ": " + LEVELS[levelIndex+1].name;
  overlay.classList.add("shown");
  /* force reflow so the slide-up transition runs from the hidden state */
  void overlay.offsetWidth;
  setTimeout(function(){ overlay.classList.add("open"); }, 350);
}

/* ---------- Share ---------- */
function shareText(){
  return "🏀 #30 Free Throws — Level " + (levelIndex+1) + " (" + level.name + "): I scored " +
         score + " pts (" + makes + "/10 makes). Can you beat it?";
}
function doShare(){
  var text = shareText();
  if(navigator.share){
    navigator.share({ title: "#30 Free Throws", text: text }).catch(function(){});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied, showCopied);
  } else {
    showCopied();
  }
}
function showCopied(){
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1600);
}

/* ---------- Main loop (60fps via requestAnimationFrame) ---------- */
function loop(now){
  var dt = Math.min((now - lastT) / 1000 || 0, 0.05);
  lastT = now;

  /* Power meter sweep */
  if(meterRunning && !roundOver){
    meterPos += meterDir * level.meterSpeed * dt;
    if(meterPos >= 0.995){ meterPos = 0.995; meterDir = -1; }
    if(meterPos <= 0.005){ meterPos = 0.005; meterDir = 1; }
  }
  needleEl.style.left = (meterPos * 100) + "%";

  /* Referee stroll (pure decoration, runs on the same clock) */
  updateReferee(dt);

  /* Idle trigger: 5s with the ball ready and no shot brings the ref out */
  updateIdleReferee(dt);

  /* Moving hoop */
  if(level.movingHoop > 0){
    hoopPhase += dt * 1.6;
    hoopOffset = Math.sin(hoopPhase) * level.movingHoop;
  } else {
    hoopOffset = 0;
  }
  hoopGroup.setAttribute("transform", "translate(" + hoopOffset.toFixed(1) + ",0)");

  /* Defender hand wave */
  if(level.defender){
    var wave = Math.sin(now / 180) * 5;
    defHand.setAttribute("transform", "translate(" + wave.toFixed(1) + ",0)");
  }

  /* Ball flight: quadratic arc from the shooter's hands to the target */
  if(flight){
    flight.t += dt / flight.dur;
    var t = Math.min(flight.t, 1);
    var x = flight.x0 + (flight.x1 - flight.x0) * t + level.wind * 10 * t * t;
    var y = flight.y0 + (flight.y1 - flight.y0) * t;
    /* parabolic lift, deepest mid-flight */
    var lift = 4 * t * (1 - t);
    var peakY = flight.peak;
    var arcY = (peakY - (flight.y0 + flight.y1) / 2) * lift;
    y += arcY;
    /* rattle-in: small jitter as the ball reaches the rim */
    if(flight.kind === "rattle" && t > 0.82){
      x += Math.sin(t * 90) * 3.5;
    }
    ball.x = x; ball.y = y; ball.r = t * 340;
    ballEl.setAttribute("transform", "translate(" + x.toFixed(1) + "," + y.toFixed(1) + ") rotate(" + ball.r.toFixed(0) + ")");
    var shX = 96 + (x - 118) * 0.82;
    ballShadow.setAttribute("cx", shX.toFixed(1));
    ballShadow.setAttribute("opacity", (0.22 - Math.max(0, (330 - y)) * 0.0006).toFixed(2));
    if(flight.t >= 1) finishFlight();
  }

  requestAnimationFrame(loop);
}

/* ---------- Input ---------- */
/* Unlock audio on the very first user gesture (mobile autoplay rules) */
document.addEventListener("pointerdown", function(){ ensureAudio(); }, { passive:true });
document.addEventListener("keydown", function(){ ensureAudio(); });

soundBtn.addEventListener("click", function(e){
  e.stopPropagation();
  ensureAudio();
  setMuted(!muted);
  if(!muted) sfxClick();   // little confirmation tick when turning sound on
});
soundBtn.addEventListener("pointerdown", function(e){ e.stopPropagation(); });

trophyBtn.addEventListener("click", function(e){ e.stopPropagation(); ensureAudio(); sfxClick(); openLeaderboard(); });
trophyBtn.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
$("lbCloseBtn").addEventListener("click", function(){ ensureAudio(); sfxClick(); closeLeaderboard(); });
$("lbDoneBtn").addEventListener("click", function(){ ensureAudio(); sfxClick(); closeLeaderboard(); });
lbOverlay.addEventListener("pointerdown", function(e){ if(e.target === lbOverlay) closeLeaderboard(); });
$("lbSaveBtn").addEventListener("click", function(){ ensureAudio(); sfxClick(); saveLbEntry(); });
lbSkipBtn.addEventListener("click", function(){ lbPending = null; lbHandled = true; lbEntryEl.hidden = true; });
lbNameInput.addEventListener("keydown", function(e){
  e.stopPropagation();
  if(e.key === "Enter"){ e.preventDefault(); saveLbEntry(); }
});

shootBtn.addEventListener("click", function(e){ e.stopPropagation(); shoot(); });
courtWrap.addEventListener("pointerdown", function(){ shoot(); });
$("shareHudBtn").addEventListener("click", function(e){ e.stopPropagation(); ensureAudio(); sfxClick(); doShare(); });
$("sharePanelBtn").addEventListener("click", function(){ ensureAudio(); sfxClick(); doShare(); });
$("playAgainBtn").addEventListener("click", function(){ ensureAudio(); sfxClick(); startRound(); renderChips(); });
$("nextLevelBtn").addEventListener("click", function(){
  ensureAudio(); sfxClick();
  if(levelIndex + 1 < LEVELS.length) selectLevel(levelIndex + 1);
});
document.addEventListener("keydown", function(e){
  if(e.code === "Escape" && lbOverlay.classList.contains("open")){ closeLeaderboard(); return; }
  if(e.code === "Space" && !overlay.classList.contains("open") && !lbOverlay.classList.contains("open")){
    e.preventDefault(); shoot();
  }
});

/* ---------- Go ---------- */
updateSoundBtn();
updateTopLine();
try{ fetchSharedBoard(); }catch(e){}
renderChips();
startRound();
requestAnimationFrame(loop);
})();
</script>
